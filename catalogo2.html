<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Libros</title>
    <style>
        /* Estilos globales */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Buscador */
        #searchBox {
            margin-bottom: 15px;
            padding: 10px;
            width: 100%;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
            display: block;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        #searchBox:focus {
            border-color: #5b9bd5;
            outline: none;
        }

        /* Botón de borrar filtro */
        #clearFilter {
            background-color: #ff5a5f;
            border: none;
            padding: 10px 15px;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.3s;
            margin-left: 10px;
        }

        #clearFilter:hover {
            background-color: #ff3b41;
        }

        /* Tabla */
        table {
            width: 100%;
            max-width: 1000px;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            color: #555;
        }

        th {
            background-color: #5b9bd5;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a {
            color: #5b9bd5;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Paginación */
        .pagination {
            margin-top: 20px;
            text-align: center;
        }

        .pagination button {
            padding: 10px 15px;
            margin: 0 5px;
            background-color: #55a4ee;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .pagination button:hover {
            background-color: #4a89c2;
        }

        .pagination button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .pageNumberInput {
            padding: 5px;
            width: 50px;
            font-size: 14px;
            margin-left: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .pageNumbers {
            margin-top: 10px;
            text-align: center;
        }

        .pageNumbers button {
            margin: 0 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #f0f4f7;
            cursor: pointer;
        }

        .pageNumbers button.active {
            background-color: #5b9bd5;
            color: white;
        }

        .pageNumbers button:hover {
            background-color: #4a89c2;
            color: white;
        }

        .pageNumbers button.disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .pageNumbers input {
            padding: 5px;
            width: 50px;
            font-size: 14px;
            margin-left: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        /* Contador de resultados */
        #resultCount {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Lista de Libros</h2>
    
    <!-- Buscador -->
    <input type="text" id="searchBox" placeholder="Buscar por título..." oninput="filterTable()">
    <button id="clearFilter" onclick="clearFilter()">Borrar Filtro</button>

    <!-- Contador de resultados -->
    <div id="resultCount"></div>

    <table id="booksTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Título en Español</th>
                <th>Enlace</th>
            </tr>
        </thead>
        <tbody>
            <!-- Las filas se insertarán dinámicamente aquí -->
        </tbody>
    </table>

    <!-- Paginación -->
    <div class="pagination">
        <button id="prevPage" onclick="changePage(-1)">Anterior</button>
        <span id="pageNumberDisplay"></span>
        <button id="nextPage" onclick="changePage(1)">Siguiente</button>
    </div>

    <!-- Números de página dinámicos -->
    <div class="pageNumbers" id="pageNumbers"></div>
    
    <!-- Buscador de página -->
    <div>
        <input type="number" id="pageInput" class="pageNumberInput" min="1" placeholder="Página" onchange="goToPage()">
    </div>

    <script>
        let books = [];
        let filteredBooks = []; // Para almacenar los libros filtrados
        let currentPage = 1;
        const itemsPerPage = 40; // Número de libros por página

        // Cargar datos desde el archivo JSON
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                books = data;
                filteredBooks = books; // Inicialmente no hay filtro
                generateTable(filteredBooks, currentPage);
            })
            .catch(error => {
                console.error('Error al cargar el archivo JSON:', error);
            });

        // Función para crear las filas de la tabla
        function generateTable(data, page) {
            const tableBody = document.querySelector("#booksTable tbody");
            const start = (page - 1) * itemsPerPage;
            const end = page * itemsPerPage;
            const pageData = data.slice(start, end);
            
            // Limpiar el contenido de la tabla (en caso de que se llame varias veces)
            tableBody.innerHTML = '';

            // Recorrer cada libro y agregar una fila
            pageData.forEach(book => {
                const row = document.createElement("tr");

                const idCell = document.createElement("td");
                idCell.textContent = book.id;
                row.appendChild(idCell);

                const titleCell = document.createElement("td");
                titleCell.textContent = book.title;
                row.appendChild(titleCell);

                const titleSpanishCell = document.createElement("td");
                titleSpanishCell.textContent = book.title_spanish;
                row.appendChild(titleSpanishCell);

                const linkCell = document.createElement("td");
                const link = document.createElement("a");
                link.href = book.href;
                link.textContent = "Ver Libro";
                link.target = "_blank";
                linkCell.appendChild(link);
                row.appendChild(linkCell);

                tableBody.appendChild(row);
            });

            // Actualizar la visualización de la página actual
            document.getElementById('pageNumberDisplay').textContent = `Página ${currentPage}`;
            updatePageNumbers();

            // Habilitar/deshabilitar botones de paginación
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage * itemsPerPage >= data.length;

            // Actualizar el contador de resultados
            document.getElementById('resultCount').textContent = `Resultados encontrados: ${data.length}`;
        }

        // Función para cambiar la página
        function changePage(direction) {
            currentPage += direction;
            generateTable(filteredBooks, currentPage);
        }

        // Función para filtrar los resultados por título
        function filterTable() {
            const query = document.getElementById("searchBox").value.toLowerCase();
            filteredBooks = books.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.title_spanish.toLowerCase().includes(query)
            );
            currentPage = 1; // Al aplicar un filtro, volvemos a la primera página
            generateTable(filteredBooks, currentPage);
        }

        // Función para borrar el filtro y mostrar todos los libros
        function clearFilter() {
            document.getElementById("searchBox").value = ''; // Limpiar el input de búsqueda
            filteredBooks = books; // Mostrar todos los libros
            currentPage = 1; // Volver a la primera página
            generateTable(filteredBooks, currentPage);
        }

        // Función para actualizar los números de página
        function updatePageNumbers() {
            const totalPages = Math.ceil(filteredBooks.length / itemsPerPage);
            const startPage = Math.max(1, currentPage - 5);  // Muestra 5 páginas antes de la actual
            const endPage = Math.min(totalPages, startPage + 9);  // Muestra hasta 10 páginas en total

            const pageNumbersDiv = document.getElementById("pageNumbers");
            pageNumbersDiv.innerHTML = '';

            // Siempre mostrar la primera página y la última
            const firstPageButton = document.createElement("button");
            firstPageButton.textContent = "1";
            firstPageButton.onclick = () => {
                currentPage = 1;
                generateTable(filteredBooks, currentPage);
            };
            pageNumbersDiv.appendChild(firstPageButton);

            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement("button");
                pageButton.textContent = i;
                pageButton.onclick = () => {
                    currentPage = i;
                    generateTable(filteredBooks, currentPage);
                };
                if (i === currentPage) {
                    pageButton.classList.add("active");
                }
                pageNumbersDiv.appendChild(pageButton);
            }

            // Siempre mostrar la última página
            if (endPage < totalPages) {
                const lastPageButton = document.createElement("button");
                lastPageButton.textContent = totalPages;
                lastPageButton.onclick = () => {
                    currentPage = totalPages;
                    generateTable(filteredBooks, currentPage);
                };
                pageNumbersDiv.appendChild(lastPageButton);
            }
        }

        // Función para ir a la página especificada en el input
        function goToPage() {
            const pageInput = document.getElementById("pageInput");
            const targetPage = parseInt(pageInput.value);
            if (targetPage && targetPage > 0 && targetPage <= Math.ceil(filteredBooks.length / itemsPerPage)) {
                currentPage = targetPage;
                generateTable(filteredBooks, currentPage);
            } else {
                alert("Página no válida.");
            }
        }
    </script>
</body>
</html>
