                <p>${chapters}</p>
            </div>
            <div class="keywords">
                <h3>Palabras Clave</h3>
                <p>${keywords}</p>
            </div>
            <div class="guide" style="display:none;">
                <h3>Guía</h3>
                <div class="no-bullets">${guide.map(item => `<div>${item}</div>`).join('')}</div>
            </div>
            <div class="description" style="display:none;">
                <h3>Descripción</h3>
                <div class="no-bullets">${description.map(item => `<div>${item}</div>`).join('')}</div>
            </div>
            <div class="collapse-button-container">
                <button class="collapse-button" onclick="toggleCollapse(this)">Mostrar Descripción/Guía</button>
            </div>
            <div style="text-align:center; margin-top:10px;">
                <button class="collapse-button" style="background-color:#dc3545;" onclick="eliminarDeFavoritos(${index})">Eliminar de Favoritos</button>
            </div>
        `;
        contenedor.appendChild(bookElement);
    });
}
    function eliminarDeFavoritos(index) {
    let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
    favoritos.splice(index, 1);
    localStorage.setItem("favoritos", JSON.stringify(favoritos));
    renderFavoritos(); // vuelve a renderizar la lista actualizada
}

    


    function mostrarLista() {
    document.getElementById("book-list-container").style.display = "block";
    document.getElementById("favoritos-list-container").style.display = "none";
    }

    function mostrarFavoritos() {
    document.getElementById("book-list-container").style.display = "none";
    document.getElementById("favoritos-list-container").style.display = "block";
    renderFavoritos();
    }

    function updateResultsCount() {
        const resultsCountElement = document.getElementById("results-count");
        resultsCountElement.textContent = `${filteredBooks.length} resultados encontrados`;
    }

    function changePageButtons(direction) {
    if (direction === 'prev' && currentPage > 1) {
            currentPage--;
        } else if (direction === 'next' && currentPage < Math.ceil(filteredBooks.length / booksPerPage)) {
            currentPage++;
        }
        renderBooks();
    }

    // Función para cambiar la página
    function changePage(pageNumber) {
        if (pageNumber > 0 && pageNumber <= Math.ceil(filteredBooks.length / booksPerPage)) {
            currentPage = pageNumber;
            renderBooks();
        }
    }

    // Función para ir a una página específica
    function goToPage(pageNumber) {
        currentPage = pageNumber;
        renderBooks();
    }





    // Función para actualizar los botones de paginación

    function updatePagination() {
    const paginationElement = document.getElementById("pagination");
    const totalPages = Math.ceil(filteredBooks.length / booksPerPage);
    const maxButtons = 10;

    let paginationHTML = '';

    // Siempre mostrar primera página
    paginationHTML += `<button class="page-number ${currentPage === 1 ? 'active' : ''}" onclick="changePage(1)">1</button>`;

    // Calcular el rango de páginas intermedias
    let startPage = Math.max(2, currentPage - Math.floor(maxButtons / 2));
    let endPage = startPage + maxButtons - 1;

    // Asegurarse de no exceder totalPages - 1
    if (endPage >= totalPages) {
        endPage = totalPages - 1;
        startPage = Math.max(2, endPage - maxButtons + 1);
    }

    // Añadir páginas intermedias
    for (let i = startPage; i <= endPage; i++) {
        paginationHTML += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    }

    // Mostrar última página si hay más de 1 página
    if (totalPages > 1) {
        paginationHTML += `<button class="page-number ${currentPage === totalPages ? 'active' : ''}" onclick="changePage(${totalPages})">${totalPages}</button>`;
    }

    paginationElement.innerHTML = paginationHTML;
}




    // Función para actualizar los números de la paginación
    function updatePageNumbers() {
        const paginationContainer = document.getElementById("pagination-numbers");
        if (!paginationContainer) return; // Evita el error si no existe

        const totalPages = Math.ceil(filteredBooks.length / booksPerPage);
        const pagesToShow = 10;
        let pageNumbersHTML = '';

        let startPage = Math.max(1, currentPage - Math.floor(pagesToShow / 2));
        let endPage = Math.min(totalPages, startPage + pagesToShow - 1);

        if (endPage - startPage < pagesToShow - 1) {
            startPage = Math.max(1, endPage - pagesToShow + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            pageNumbersHTML += `<button class="page-btn" onclick="goToPage(${i})">${i}</button>`;
        }

        paginationContainer.innerHTML = `
            <button class="page-btn" onclick="goToPage(1)">1</button>
            ${pageNumbersHTML}
            <button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>
        `;
    }


    function toggleCollapse(button) {
        const bookElement = button.closest(".book");
        const description = bookElement.querySelector(".description");
        const guide = bookElement.querySelector(".guide");
        const isVisible = description.style.display === "block";
        description.style.display = isVisible ? "none" : "block";
        guide.style.display = isVisible ? "none" : "block";
        button.textContent = isVisible ? "Mostrar Descripción/Guía" : "Ocultar Descripción/Guía";
    }

    // Función para agregar un filtro dinámicamente
    function addFilter() {
        const filterContainer = document.getElementById('filters');
        const filterDiv = document.createElement('div');
        filterDiv.classList.add('filter-group');
        
        const keywordsSelect = allKeywords.map((keyword, index) => 
            `<option value="${keyword}">${keyword} - ${keywordsEs[index]}</option>`
        ).join('');

        filterDiv.innerHTML = `
            <select class="filter-keyword">
                <option value="">Selecciona palabra clave</option>
                ${keywordsSelect}
            </select>
            <input type="checkbox" class="exclude-checkbox"> Excluir
            <button onclick="removeFilter(this)">Eliminar</button>
        `;
        filterContainer.appendChild(filterDiv);
    }

    // Función para eliminar un filtro
    function removeFilter(button) {
        const filterDiv = button.closest('.filter-group');
        filterDiv.remove();
    }

    // Función para aplicar los filtros
    function applyFilters() {
    const filterLogic = document.getElementById('filter-logic')?.value || 'or'; // fallback por si no existe
    const filterKeywords = [];
    const excludeKeywords = [];

    // Usar filtros activos de los chips
    Object.entries(activeKeywordFilters).forEach(([kw, type]) => {
        if (type === "include") filterKeywords.push(kw);
        if (type === "exclude") excludeKeywords.push(kw);
    });

    // Filtrar los libros
    filteredBooks = books.filter(book => {
        const bookKeywords = book.keywords.join(' ').toLowerCase();

        const includeMatch = filterKeywords.length === 0 || (
            filterLogic === 'or'
                ? filterKeywords.some(keyword => bookKeywords.includes(keyword.toLowerCase()))
                : filterKeywords.every(keyword => bookKeywords.includes(keyword.toLowerCase()))
        );

        const excludeMatch = excludeKeywords.some(keyword => bookKeywords.includes(keyword.toLowerCase()));

        return includeMatch && !excludeMatch;
    });

    renderBooks();
}


    // Función para limpiar los filtros
    function clearFilters() {
        const filterContainer = document.getElementById('filters');
        filterContainer.innerHTML = '';
        filteredBooks = books;
        renderBooks();
    }

    // Función para buscar por título
    function searchBooks() {
        searchQuery = document.getElementById('search').value.toLowerCase();

        filteredBooks = books.filter(book => {
            const title = book.title.join(' ').toLowerCase();
            return title.includes(searchQuery);
        });

        currentPage = 1; // Volver a la primera página
        renderBooks();
    }

    const activeKeywordFilters = {}; // Almacena el estado actual de cada palabra clave

function toggleKeywordSelector() {
    const container = document.getElementById("keyword-selector");
    container.style.display = container.style.display === "none" ? "block" : "none";

    const buttonContainer = document.getElementById("keyword-buttons");
    if (buttonContainer.children.length === 0) {
        allKeywords.forEach((keyword, i) => {
            const chip = document.createElement("span");
            chip.textContent = keywordsEs[i] ? `${keyword} (${keywordsEs[i]})` : keyword;
            chip.setAttribute("data-keyword", keyword);
            chip.className = "keyword-chip";
            chip.style.padding = "6px 12px";
            chip.style.borderRadius = "20px";
            chip.style.border = "1px solid #ccc";
            chip.style.backgroundColor = "#eee";
            chip.style.cursor = "pointer";
            chip.style.userSelect = "none";
            chip.style.transition = "all 0.2s ease";

            chip.onclick = () => {
                const kw = chip.getAttribute("data-keyword");
                const current = activeKeywordFilters[kw];
                if (current === "include") {
                    delete activeKeywordFilters[kw]; // desactivar
                } else {
                    activeKeywordFilters[kw] = "include";
                }
                updateKeywordChipStyles();
                applyFilters();
            };

            chip.ondblclick = () => {
                const kw = chip.getAttribute("data-keyword");
                activeKeywordFilters[kw] = "exclude";
                updateKeywordChipStyles();
                applyFilters();
            };

            buttonContainer.appendChild(chip);
        });
    }
}

function updateKeywordChipStyles() {
    const chips = document.querySelectorAll(".keyword-chip");
    chips.forEach(chip => {
        const keyword = chip.getAttribute("data-keyword");
        const state = activeKeywordFilters[keyword];
        if (state === "include") {
            chip.style.backgroundColor = "#28a745";
            chip.style.color = "white";
            chip.style.border = "1px solid #1e7e34";
        } else if (state === "exclude") {
            chip.style.backgroundColor = "#dc3545";
            chip.style.color = "white";
            chip.style.border = "1px solid #bd2130";
        } else {
            chip.style.backgroundColor = "#eee";
            chip.style.color = "black";
            chip.style.border = "1px solid #ccc";
        }
    });
}


</script>
